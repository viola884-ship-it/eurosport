name = "telegram-order-bot"
main = "src/index.ts"
compatibility_date = "2026-05-24"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "orders-db"
database_id = "<create via: wrangler d1 create orders-db>"

# Environment variables (set MANAGER_CHAT_ID before deploying)
[vars]
MANAGER_CHAT_ID = "<your-telegram-chat-id>"

# Secrets (set via `wrangler secret put <NAME>` before deploying)
# BOT_TOKEN                — Telegram bot token (botfather)
# DASHBOARD_PASSWORD       — shared password for the dashboard login screen
# TELEGRAM_BOT_TOKEN       — same bot token, used by the dashboard-api worker
#                            for sending customer notifications on status changes
